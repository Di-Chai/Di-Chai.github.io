# intro 用 | 保留段落，空行分段；支持 **加粗**，个人邮箱自动显示为邮件链接。
title: To Prospective Students
intro: |
  I am looking for master's and PhD students with **strong computer science fundamentals** and a **genuine passion for building systems**. You should enjoy understanding how systems work, turning ideas into working implementations, and investigating why something fails or performs poorly.

  **I value learning ability and curiosity more than extensive prior research experience.** What matters is your willingness to tackle unfamiliar problems: learning the concepts and tools you need, asking thoughtful questions, and testing ideas through careful reasoning and experimentation. I appreciate students who take initiative and revise their assumptions when the evidence calls for it.

  Please email **chaidi@mail.sufe.edu.cn** with a brief introduction to your background and interests. You are welcome to share a project you have built or a technical problem you enjoyed solving—from coursework, personal exploration, open-source contributions, or research. I would like to hear how you approached it and what you learned.

