- id: kvmem
  title: "KVMem: Virtualizing Million-Token Agent Workspaces on a Consumer GPU"
  authors: [Di Chai, Leye Wang, Zeshen Su, Zhiguo Xia, Zhihang Yu]
  year: 2026
  venue: arXiv 2026
  selected: false
  paper: https://arxiv.org/pdf/2609.04852
  code: https://github.com/kvmem/kvmem-llama.cpp
  video: https://www.bilibili.com/video/BV1r2ey6EEh5/
  highlight:
    name: KVMem
    image:
      path: assets/img/kvmem-project.png
      alt: KVMem overview showing a historical agent workspace, tiered KV storage, and a compact active execution view on the GPU.
    summary: Virtualizes million-token agent workspaces on a consumer GPU, keeping history as reusable KV blocks and retrieving only the context needed for each step.
    insight: The paper separates the persistent KV workspace from the model's active context window. Query-conditioned retrieval selects relevant historical blocks and assembles a bounded execution view, reusing previously computed KV state instead of repeatedly prefilling recalled text.

- id: centrifuge
  title: Unlocking Full Efficiency of Token Filtering in Large Language Model Training
  authors: [Di Chai, Pengbo Li, Feiyuan Zhang, Yilun Jin, Han Tian, Kaiqiang Xu, Binhang Yuan, Dian Shen, Junxue Zhang, Kai Chen]
  year: 2026
  venue: ICLR 2026
  classification: CCF-A
  selected: true
  paper: https://arxiv.org/abs/2502.00340
  code: https://github.com/Di-Chai/Centrifuge
  proceedings: https://proceedings.iclr.cc/paper_files/paper/2026/hash/d65c4ce22241138c1784ff753d4c746c-Abstract-Conference.html
  highlight:
    name: Centrifuge
    tagline: Efficient token filtering for large language model training
    topic: LLM training
    illustration: token-filtering
    image:
      path: assets/img/centrifuge-project.png
      alt: Centrifuge project illustration showing blue and orange tokens passing through a futuristic filtering device.
    summary: Algorithm–system co-design that turns token filtering into practical training speedups while preserving its model utility benefits.
    result: Up to 34.7%
    result_label: less end-to-end training time
    conditions: At 50% token filtering; maximum across evaluated settings on 1.1B–40B models.
    insight: Token filtering alone does not guarantee faster training. Centrifuge filters activations in attention backward and transforms sparse GEMM into dimension-reduced dense GEMM, enabling efficient execution with standard machine learning libraries.

